name: Reproducibility and isolation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q -m 'not container'
      - run: ./reserve check
      - run: ./reserve setup
      - run: RESERVE_TEST_CONTAINERS=1 uv run pytest -q -m container
